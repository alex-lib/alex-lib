<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif; }
    .kw  { fill: #6DB33F; }
    .fn  { fill: #E3EFE5; }
    .str { fill: #B5E48C; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0E1B12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#6DB33F" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6DB33F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6DB33F"/>
      <stop offset="1" stop-color="#B5E48C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- left: headline -->
  <text x="62" y="176" class="sans" font-size="72" font-weight="800" fill="#F2F8F3" letter-spacing="-1.5">Java &amp; Kotlin</text>
  <text x="64" y="232" class="sans" font-size="40" font-weight="400" fill="#6DB33F">developer</text>
  <rect x="64" y="262" width="180" height="5" rx="2.5" fill="url(#bar)"/>

  <!-- right: code window -->
  <rect x="660" y="48" width="572" height="264" rx="14" fill="#070D09" stroke="#1F3A26" stroke-width="1.5"/>
  <path d="M674 48 h130 a8 8 0 0 1 8 8 v32 h-152 v-26 a14 14 0 0 1 14 -14 z" fill="#12261A"/>
  <text x="684" y="74" class="mono" font-size="15" fill="#A9C7B0">Developer.kt</text>
  <line x1="660" y1="88" x2="1232" y2="88" stroke="#1F3A26" stroke-width="1"/>

  <g class="mono" font-size="19">
    <text x="688" y="128"><tspan class="kw">data class</tspan><tspan class="fn" x="814">Developer(</tspan></text>
    <text y="160"><tspan class="kw" x="734">val</tspan><tspan class="fn" x="780">stack</tspan><tspan class="fn" x="882">=</tspan><tspan class="fn" x="905">listOf(</tspan><tspan class="str">"Java"</tspan><tspan class="fn">,</tspan><tspan class="str" x="1064">"Kotlin"</tspan><tspan class="fn">),</tspan></text>
    <text y="192"><tspan class="kw" x="734">val</tspan><tspan class="fn" x="780">telegram</tspan><tspan class="fn" x="882">=</tspan><tspan class="str" x="905">"@exceedspace"</tspan><tspan class="fn">,</tspan></text>
    <text y="224"><tspan class="kw" x="734">val</tspan><tspan class="fn" x="780">email</tspan><tspan class="fn" x="882">=</tspan><tspan class="str" x="905">"docode@inbox.ru"</tspan><tspan class="fn">,</tspan></text>
    <text y="256"><tspan class="kw" x="734">val</tspan><tspan class="fn" x="780">habr</tspan><tspan class="fn" x="882">=</tspan><tspan class="str" x="905">"@Alex-CODEin"</tspan></text>
    <text x="688" y="288" class="fn">)</text>
  </g>
  <rect class="cursor" x="703" y="272" width="10" height="21" fill="#6DB33F"/>
</svg>
